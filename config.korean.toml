# 모델 프롬프트 시 사용할 시스템 프롬프트
# System prompt to use when prompting the model.
system_prompt = "당신은 도움이 되는 AI 어시스턴트입니다."

# 거부를 일으키지 않는 프롬프트 데이터셋 (거부 방향 계산용)
# Dataset of prompts that tend to not result in refusals (for calculating refusal directions).
#
# 한국어 데이터셋을 사용하려면 아래 주석을 해제하고 위를 주석 처리하세요:
# To use Korean datasets, uncomment the lines below and comment out the lines above:
#
[good_prompts]
dataset = "./datasets/korean_harmless_train"
split = "None"  # 로컬 데이터셋은 "None" 사용 / Use "None" for local datasets
column = "text"

# 거부를 일으키는 프롬프트 데이터셋 (거부 방향 계산용)
# Dataset of prompts that tend to result in refusals (for calculating refusal directions).
[bad_prompts]
dataset = "./datasets/korean_harmful_train"
split = "None"  # 로컬 데이터셋은 "None" 사용 / Use "None" for local datasets
column = "text"

# 거부를 일으키지 않는 프롬프트 데이터셋 (모델 성능 평가용)
# Dataset of prompts that tend to not result in refusals (for evaluating model performance).
[good_evaluation_prompts]
dataset = "./datasets/korean_harmless_eval"
split = "None"  # 로컬 데이터셋은 "None" 사용 / Use "None" for local datasets
column = "text"

# 거부를 일으키는 프롬프트 데이터셋 (모델 성능 평가용)
# Dataset of prompts that tend to result in refusals (for evaluating model performance).
[bad_evaluation_prompts]
dataset = "./datasets/korean_harmful_eval"
split = "None"  # 로컬 데이터셋은 "None" 사용 / Use "None" for local datasets
column = "text"
