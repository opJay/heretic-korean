# 한국어 모델용 Heretic 설정 파일
# This configuration file is optimized for Korean language models.

# 모델 텐서 로딩 시 시도할 PyTorch dtype 목록
# List of PyTorch dtypes to try when loading model tensors.
dtypes = [
    "auto",      # 대부분 bfloat16을 의미
    "float16",   # Ampere 이전 하드웨어용 대안
    "float32",   # 최종 대안
]

# 모델 로딩 시 Accelerate에 전달할 장치 맵
# Device map to pass to Accelerate when loading the model.
device_map = "auto"

# 병렬 처리할 입력 시퀀스 수 (0 = 자동)
# Number of input sequences to process in parallel (0 = auto).
batch_size = 0  # auto

# 배치 크기 자동 결정 시 시도할 최대 배치 크기
# Maximum batch size to try when automatically determining the optimal batch size.
max_batch_size = 128

# 각 응답에 대해 생성할 최대 토큰 수
# Maximum number of tokens to generate for each response.
max_response_length = 100

# Residual 및 거부 방향에 대한 상세 정보 출력 여부
# Whether to print detailed information about residuals and refusal directions.
print_refusal_geometry = false

# Abliterated 모델의 원본 모델로부터의 KL divergence "일반적인" 값
# Assumed "typical" value of the Kullback-Leibler divergence from the original model.
kl_divergence_scale = 1.0

# 최적화 중 실행할 abliteration 시도 횟수
# Number of abliteration trials to run during optimization.
n_trials = 200

# 탐색 목적으로 랜덤 샘플링을 사용하는 시도 횟수
# Number of trials that use random sampling for exploration.
n_startup_trials = 60

# 응답에 포함되면 거부로 식별되는 문자열 (대소문자 무시)
